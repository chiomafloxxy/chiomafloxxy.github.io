# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: chiomafloxxy/chiomafloxxy.github.io
  branch: main

media_folder: /assets/images/products
public_folder: /assets/images/products

collections:
  - name: site_pages
    label: Site Pages
    files:
      - name: home
        label: Homepage
        file: content/home.json
        fields:
          - { label: Hero Badge, name: hero_badge, widget: string }
          - { label: Hero Title - First Line, name: hero_title_first, widget: string }
          - { label: Hero Title - Second Line, name: hero_title_second, widget: string }
          - { label: Hero Tagline, name: hero_tagline, widget: string }
          - { label: Hero Description, name: hero_description, widget: text }
          - { label: Values Eyebrow, name: values_eyebrow, widget: string }
          - { label: Values Title - First Part, name: values_title_first, widget: string }
          - { label: Values Title - Emphasis, name: values_title_accent, widget: string }
          - { label: Values Description, name: values_description, widget: text }
          - { label: Feature 1 Title, name: feature_1_title, widget: string }
          - { label: Feature 1 Description, name: feature_1_description, widget: text }
          - { label: Feature 2 Title, name: feature_2_title, widget: string }
          - { label: Feature 2 Description, name: feature_2_description, widget: text }
          - { label: Feature 3 Title, name: feature_3_title, widget: string }
          - { label: Feature 3 Description, name: feature_3_description, widget: text }
      - name: about
        label: About Page
        file: content/about.json
        fields:
          - { label: Hero Eyebrow, name: hero_eyebrow, widget: string }
          - { label: Hero Title - First Part, name: hero_title_first, widget: string }
          - { label: Hero Title - Emphasis, name: hero_title_accent, widget: string }
          - { label: Hero Description, name: hero_description, widget: text }
          - { label: Founder Section Eyebrow, name: founder_eyebrow, widget: string }
          - { label: Founder Name, name: founder_name, widget: string }
          - { label: Founder Nickname, name: founder_nickname, widget: string }
          - { label: Founder Paragraph 1, name: founder_paragraph_1, widget: text }
          - { label: Founder Paragraph 2, name: founder_paragraph_2, widget: text }
          - { label: Founder Paragraph 3, name: founder_paragraph_3, widget: text }
      - name: contact
        label: Contact Page
        file: content/contact.json
        fields:
          - { label: Hero Eyebrow, name: hero_eyebrow, widget: string }
          - { label: Hero Title - First Part, name: hero_title_first, widget: string }
          - { label: Hero Title - Emphasis, name: hero_title_accent, widget: string }
          - { label: Hero Description, name: hero_description, widget: text }
          - { label: Contact Section Eyebrow, name: contact_eyebrow, widget: string }
          - { label: Contact Section Title - First Part, name: contact_title_first, widget: string }
          - { label: Contact Section Title - Emphasis, name: contact_title_accent, widget: string }
          - { label: Contact Section Description, name: contact_description, widget: text }
          - { label: Location, name: location, widget: string }
          - { label: Business Hours, name: business_hours, widget: string }
          - { label: Service Area Eyebrow, name: service_eyebrow, widget: string }
          - { label: Service Area Title - First Part, name: service_title_first, widget: string }
          - { label: Service Area Title - Emphasis, name: service_title_accent, widget: string }
          - { label: Service Area Description, name: service_description, widget: text }
      - name: gallery
        label: Gallery Page
        file: content/gallery.json
        fields:
          - { label: Hero Eyebrow, name: hero_eyebrow, widget: string }
          - { label: Hero Title - First Part, name: hero_title_first, widget: string }
          - { label: Hero Title - Emphasis, name: hero_title_accent, widget: string }
          - { label: Hero Description, name: hero_description, widget: text }
          - { label: Gallery Note, name: gallery_note, widget: string }
          - { label: CTA Eyebrow, name: cta_eyebrow, widget: string }
          - { label: CTA Title - First Part, name: cta_title_first, widget: string }
          - { label: CTA Title - Emphasis, name: cta_title_accent, widget: string }
          - { label: CTA Description, name: cta_description, widget: text }
          - label: Products
            name: products
            widget: list
            label_singular: Product
            summary: "{{fields.title}} ({{fields.category}})"
            fields:
              - label: Category
                name: category
                widget: select
                options:
                  - { label: Honey, value: honey }
                  - { label: Nuts, value: nuts }
                  - { label: Oils, value: oil }
                  - { label: Gifts, value: gifts }
                  - { label: Foodstuffs, value: staples }
              - { label: Product Name, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - label: Price and Pack Size (optional)
                name: price
                widget: string
                required: false
                hint: Enter the Naira price and pack size together, for example ₦27,600 / 500g. Leave blank to show Price on request.
              - { label: Product Photo, name: image, widget: image, required: true }
              - label: Options (optional)
                name: options
                widget: list
                required: false
                label_singular: Option
                summary: "{{fields.label}} {{fields.price}}"
                hint: Use this when one product comes in different packs with different prices, for example bottled and small wrapped packs. If you add options, leave the price above blank. Each option gets its own quantity buttons on the site.
                fields:
                  - { label: Option Name, name: label, widget: string }
                  - { label: Price and Pack Size, name: price, widget: string, hint: "For example, ₦100 each" }
                  - { label: Option Photo (optional), name: image, widget: image, required: false }
