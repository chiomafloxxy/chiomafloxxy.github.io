# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: chiomafloxxy/chiomafloxxy.github.io
  branch: main

media_folder: /assets/images/products
public_folder: /assets/images/products

collections:
  - name: site_pages
    label: Site Pages
    files:
      - name: home
        label: Home
        file: content/home.json
        fields:
          - { label: Headline, name: hero_title, widget: string }
          - { label: Intro, name: hero_description, widget: text }
      - name: products
        label: Products
        file: content/gallery.json
        fields:
          - { label: Section Title, name: title, widget: string }
          - { label: Intro, name: intro, widget: text }
          - label: Products
            name: products
            widget: list
            label_singular: Product
            summary: "{{fields.title}} ({{fields.category}})"
            fields:
              - label: Category
                name: category
                widget: select
                options:
                  - { label: Honey, value: honey }
                  - { label: Nuts, value: nuts }
                  - { label: Oils, value: oil }
                  - { label: Gifts, value: gifts }
                  - { label: Foodstuffs, value: staples }
              - { label: Product Name, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - label: Price and Pack Size (optional)
                name: price
                widget: string
                required: false
                hint: Enter the Naira price and pack size together, for example ₦27,600 / 500g. Leave blank to show Price on request.
              - { label: Product Photo, name: image, widget: image, required: true }
      - name: about
        label: About
        file: content/about.json
        fields:
          - { label: Section Title, name: title, widget: string }
          - { label: Paragraph 1, name: paragraph_1, widget: text }
          - { label: Paragraph 2, name: paragraph_2, widget: text }
          - { label: Paragraph 3, name: paragraph_3, widget: text }
      - name: contact
        label: Contact
        file: content/contact.json
        fields:
          - { label: Section Title, name: title, widget: string }
          - { label: Intro, name: intro, widget: text }
          - { label: Location, name: location, widget: string }
          - { label: Business Hours, name: business_hours, widget: string }
          - { label: Areas We Serve, name: service_area, widget: text }
