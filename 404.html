<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf9f5">
  <meta name="robots" content="noindex">
  <title>Page Not Found | C.Zara Enterprise</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="page-404">
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you’re looking for may have moved or is no longer available.</p>
    <div class="actions"><a class="btn" href="/">Back to home</a><a class="btn btn-line" href="/#contact">Contact us</a></div>
  </main>
  <script>
    (function () {
      var map = { 'about.html': 'about', 'gallery.html': 'products', 'contact.html': 'contact', 'index.html': 'home' };
      var last = location.pathname.split('/').pop();
      if (map[last]) location.replace(location.pathname.replace(/[^/]*$/, '') + '#' + map[last]);
    })();
  </script>
</body>
</html>
